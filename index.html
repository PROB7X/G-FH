<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Fishing MMO</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
    canvas { display: block; image-rendering: pixelated; }
    #fs-overlay, .modal { position: fixed; inset: 0; background: rgba(10,15,25,0.95); z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #fs-overlay { z-index: 10000; }
    #fs-close { position: absolute; top: 15px; right: 20px; font-size: 28px; color: #aaa; background: none; border: none; cursor: pointer; }
    .btn { background: #2ecc71; color: #000; border: 2px solid #27ae60; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; }
    .hidden { display: none !important; }
    input { padding: 10px; font-size: 16px; margin: 6px 0; background: #222; color: #fff; border: 2px solid #555; width: 250px; text-align: center; }
    #hud { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(0,0,0,0.75); padding: 8px; border: 2px solid #444; border-radius: 6px; font-size: 12px; text-align: right; }
    .s-btn { background: #3498db; color: #fff; border: none; padding: 5px 8px; margin-top: 4px; cursor: pointer; border-radius: 4px; }
    #mobile-controls { position: fixed; bottom: 15px; left: 15px; right: 15px; z-index: 100; display: flex; justify-content: space-between; pointer-events: none; }
    .grp { display: flex; gap: 10px; pointer-events: auto; }
    .m-btn { width: 58px; height: 58px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 10px; color: #fff; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .win { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 88%; max-width: 560px; height: 75%; background: #1e272e; border: 3px solid #808e9b; z-index: 2000; padding: 15px; overflow-y: auto; }
    .card { background: #2f3640; padding: 8px; margin: 5px 0; border-left: 4px solid #00a8ff; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  </style>
</head>
<body>
<div id="fs-overlay">
  <button id="fs-close" onclick="closeFs()">✖</button>
  <h2>Разверните игру на весь экран</h2>
  <p style="color:#aaa;">Экран перевернется в горизонтальный режим</p>
  <button class="btn" onclick="openFs()">НА ВЕСЬ ЭКРАН</button>
</div>
<div id="login-modal" class="modal">
  <h2>PIXEL FISHING MMO</h2>
  <input id="nick-inp" placeholder="Ваш ник..." maxlength="16">
  <input id="pass-inp" type="password" class="hidden" placeholder="Пароль из secret.json">
  <button class="btn" onclick="doLogin()">ВОЙТИ</button>
  <p id="err-txt" style="color:#ff4757; margin-top:8px;"></p>
</div>
<div id="srv-modal" class="modal hidden">
  <h2>ВЫБОР СЕРВЕРА</h2>
  <div id="srv-list"></div>
  <input id="new-srv-inp" placeholder="Имя своего сервера">
  <button class="btn" onclick="startAds()">Создать сервер (2 рекламы)</button>
</div>
<div id="ad-modal" class="modal hidden">
  <h3 id="ad-lbl">Реклама 1 из 2</h3>
  <video id="ad-vid" width="320" height="180" playsinline style="border:2px solid #fff; margin:10px 0;"><source src="/1.mp4" type="video/mp4"></video>
</div>
<div id="hud" class="hidden">
  <div id="hud-info"></div>
  <button class="s-btn" onclick="openWin('inv-win')">🎒 Инвентарь / Удочка</button>
  <button class="s-btn" style="background:#e84118;" onclick="toggleLoc()">🔥 Лава (100+ лвл)</button>
</div>
<div id="mobile-controls" class="hidden">
  <div class="grp"><div class="m-btn" id="b-left">◀</div><div class="m-btn" id="b-right">▶</div></div>
  <div class="grp"><div class="m-btn" id="b-use">📦</div><div class="m-btn" id="b-act" style="width:90px; background:rgba(46,204,113,0.4);">ЗАБРОС</div></div>
</div>
<div id="inv-win" class="win hidden">
  <div style="display:flex; justify-content:space-between;"><h3>🎒 Снасти и Улов</h3><button onclick="openWin('inv-win')" style="color:red; background:none; border:none; font-size:20px;">✖</button></div>
  <p id="rod-txt" style="font-size:12px; color:#2ecc71; margin:8px 0;"></p>
  <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px;">
    <button class="s-btn" onclick="upg('base')">+Основание (50 XP)</button><button class="s-btn" onclick="upg('line')">+Леска (50 XP)</button>
    <button class="s-btn" onclick="upg('reel')">+Моток (50 XP)</button><button class="s-btn" onclick="upg('lure')">+Приманка (50 XP)</button><button class="s-btn" onclick="upg('bobber')">+Поплавок (50 XP)</button>
  </div>
  <div id="inv-list"></div>
</div>
<div id="end-win" class="win hidden">
  <div style="display:flex; justify-content:space-between;"><h3>🌌 Эндер-Сундук</h3><button onclick="openWin('end-win')" style="color:red; background:none; border:none; font-size:20px;">✖</button></div>
  <div id="end-list"></div>
</div>
<canvas id="c"></canvas>
<script>
const socket = io();
let fsClosed = false;
function openFs() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
  document.getElementById('fs-overlay').classList.add('hidden');
}
function closeFs() { fsClosed = true; document.getElementById('fs-overlay').classList.add('hidden'); }
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && !fsClosed) document.getElementById('fs-overlay').classList.remove('hidden'); });

let prof = { nick: "Рыбак", isOwner: false, xp: 0, level: 1, rod: { base:1, line:1, reel:1, lure:1, bobber:1 }, inventory: [], enderChest: [] };
let ownerToken = "", px = 350, loc = 'water', others = {};

document.getElementById('nick-inp').addEventListener('input', e => {
  document.getElementById('pass-inp').classList.toggle('hidden', e.target.value.trim() !== "HELM77ZX");
});

async function doLogin() {
  const nick = document.getElementById('nick-inp').value.trim();
  if (!nick) return;
  if (nick === "HELM77ZX") {
    const res = await fetch('/api/verify-admin', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username: nick, password: document.getElementById('pass-inp').value })
    });
    const data = await res.json();
    if (!data.success) return document.getElementById('err-txt').innerText = "Неверный пароль!";
    ownerToken = data.token; prof.isOwner = true;
    const w = await (await fetch('/widget.html?token=' + ownerToken)).text();
    document.body.insertAdjacentHTML('beforeend', w);
  }
  prof.nick = nick;
  document.getElementById('login-modal').classList.add('hidden');
  document.getElementById('srv-modal').classList.remove('hidden');
  socket.emit('getRooms');
}

window.ownerAddXp = (v) => { prof.xp += v; save(); };
window.ownerSendMsg = () => socket.emit('adminCmd', { token: ownerToken, type: 'msg', val: document.getElementById('owner-msg-inp').value });
socket.on('globalMsg', m => alert("👑 [OWNER]: " + m));

socket.on('roomsList', list => {
  const box = document.getElementById('srv-list'); box.innerHTML = '';
  list.forEach(r => {
    const b = document.createElement('button'); b.className = 'btn'; b.style.display = 'block'; b.style.margin = '5px auto';
    b.innerText = `🌐 ${r}`; b.onclick = () => enterRoom(r); box.appendChild(b);
  });
});

let adStep = 0;
function startAds() { const n = document.getElementById('new-srv-inp').value.trim(); if (!n) return alert("Введите название!"); adStep = 0; runAd(n); }
function runAd(name) {
  const m = document.getElementById('ad-modal'), v = document.getElementById('ad-vid');
  document.getElementById('ad-lbl').innerText = `Реклама ${adStep + 1} из 2`; m.classList.remove('hidden'); v.currentTime = 0;
  v.play().catch(() => setTimeout(() => finishAdStep(m, name), 3000));
  v.onended = () => finishAdStep(m, name);
}
function finishAdStep(m, name) { if (++adStep < 2) runAd(name); else { m.classList.add('hidden'); socket.emit('createRoom', name); enterRoom(name); } }

function enterRoom(roomName) {
  document.getElementById('srv-modal').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('mobile-controls').classList.remove('hidden');
  socket.emit('joinRoom', { roomName, nick: prof.nick, isOwner: prof.isOwner });
  requestAnimationFrame(loop);
}

socket.on('initProfile', p => { prof = p; updHud(); });
socket.on('currentPlayers', ps => { others = ps; delete others[socket.id]; });
socket.on('newPlayer', p => others[p.id] = p);
socket.on('playerMoved', p => others[p.id] = p);
socket.on('playerDisconnected', id => delete others[id]);
socket.on('incomingTrade', ({ fromId, fromNick }) => { if (prof.level >= 20 && confirm(`Трейд от ${fromNick}! Отдать последнюю рыбу?`)) { const item = prof.inventory.pop(); if (item) { save(); socket.emit('tradeAccept', { targetId: fromId, item }); } } });
socket.on('tradeCompleted', ({ item }) => { prof.inventory.push(item); save(); alert(`Получено: ${item.name}`); });

function save() { prof.level = Math.floor(prof.xp / 500) + 1; socket.emit('syncProfile', prof); updHud(); }
function updHud() {
  const n = prof.isOwner ? `<span style="color:gold;">[OWNER] ${prof.nick}</span>` : prof.nick;
  document.getElementById('hud-info').innerHTML = `${n} | LVL: <b>${prof.level}</b> (${prof.xp} XP) | ${loc === 'water' ? 'Вода' : 'Лава'}`;
}
function toggleLoc() { if (prof.level < 100 && !prof.isOwner) return alert("Лава доступна с 100+ уровня!"); loc = loc === 'water' ? 'lava' : 'water'; updHud(); socket.emit('playerMove', { x: px, location: loc, level: prof.level }); }
const c = document.getElementById('c'), ctx = c.getContext('2d');
function rsz() { c.width = innerWidth; c.height = innerHeight; } window.onresize = rsz; rsz();

let state = 'idle', power = 0, dir = 1, bobX = 0, barY = 50, fishY = 50, fVel = 0, prog = 30, tens = 0, hold = false, curFish = null;
const W_FISH = [{n:"Треска",w:2,c:2},{n:"Фугу",w:1.8,c:25},{n:"Зюка",w:6,c:150},{n:"Левиафан",w:300,c:100000}];
const L_FISH = [{n:"Огненный угорь",w:5,c:10},{n:"Магма-фугу",w:9,c:100},{n:"Лавовая зюка",w:24,c:1500},{n:"Дракон Ядра",w:500,c:100000}];
const MUTS = [{n:"Обычная",m:1,c:1},{n:"Прозрачная",m:1.5,c:10},{n:"Фиолетовая",m:2.2,c:50},{n:"4 глаза",m:4,c:250}];

function action() {
  if (state === 'idle') { if (px < 520) return alert("Подойдите к воде/лаве справа!"); state = 'cast'; power = 0; }
  else if (state === 'cast') {
    bobX = px + 60 + (power / 100) * (250 + prof.rod.base * 40 + prof.rod.reel * 30);
    const pool = loc === 'water' ? W_FISH : L_FISH, luck = 1 + power / 50 + prof.rod.lure * 0.5;
    let f = pool, mut = MUTS;
    pool.forEach(x => { if (Math.random() * x.c <= luck) f = x; });
    MUTS.forEach(x => { if (Math.random() * x.c <= luck) mut = x; });
    const chance = Math.round((f.c * mut.c) / luck), w = +(f.w * (0.8 + Math.random() * 0.8) * mut.m).toFixed(2);
    curFish = { name: f.n, mut: mut.n, weight: w, chance: `1 к ${chance.toLocaleString('ru-RU')}`, xp: Math.round(w * 15 * mut.m) };
    state = 'mini'; barY = 50; fishY = 50; prog = 30; tens = 0;
  }
}

const keys = {};
window.onkeydown = e => { keys[e.code] = true; if (e.code === 'Space') { hold = true; action(); } };
window.onkeyup = e => { keys[e.code] = false; if (e.code === 'Space') hold = false; };
const touch = (id, d, u) => { const el = document.getElementById(id); el.ontouchstart = e => { e.preventDefault(); d(); }; el.ontouchend = e => { e.preventDefault(); if (u) u(); }; };
touch('b-left', () => keys['ArrowLeft'] = true, () => keys['ArrowLeft'] = false);
touch('b-right', () => keys['ArrowRight'] = true, () => keys['ArrowRight'] = false);
touch('b-act', () => { hold = true; action(); }, () => hold = false);
touch('b-use', () => {
  if (Math.abs(px - 140) < 60) { renderEnd(); openWin('end-win'); }
  else if (prof.level >= 20) { for (let id in others) if (Math.abs(others[id].x - px) < 50) { socket.emit('tradeRequest', { targetId: id, fromNick: prof.nick }); break; } }
});

let camX = 0;
const vis = (wx, w) => (wx + w >= camX) && (wx <= camX + c.width);

function loop() {
  if (state === 'idle') {
    let mv = false;
    if (keys['ArrowLeft']) { px = Math.max(80, px - 4); mv = true; }
    if (keys['ArrowRight']) { px = Math.min(620, px + 4); mv = true; }
    if (mv) socket.emit('playerMove', { x: px, location: loc, level: prof.level });
  }
  if (state === 'cast') { power += 2.5 * dir; if (power >= 100 || power <= 0) dir *= -1; }
  if (state === 'mini') {
    barY = hold ? Math.max(0, barY - 2.2) : Math.min(80, barY + 1.8);
    if (Math.random() < 0.05) fVel = (Math.random() - 0.5) * 4;
    fishY = Math.max(0, Math.min(90, fishY + fVel));
    const bSize = 20 + prof.rod.bobber * 2, maxW = prof.rod.line * 15;
    if (fishY >= barY && fishY <= barY + bSize) { prog += 0.5; tens = Math.max(0, tens - 0.5); }
    else { prog -= 0.3; tens += 0.5 * (curFish.weight > maxW ? curFish.weight / maxW : 0.6); }
    if (tens >= 100) { alert(`Леска порвалась! Вес: ${curFish.weight} кг`); state = 'idle'; }
    else if (prog >= 100) { prof.inventory.push(curFish); prof.xp += curFish.xp; save(); alert(`Улов: [${curFish.mut}] ${curFish.name} (${curFish.weight} кг) | ${curFish.chance}`); state = 'idle'; }
    else if (prog <= 0) { alert("Рыба сорвалась!"); state = 'idle'; }
  }
  camX = Math.max(0, px - c.width / 3);
  ctx.fillStyle = loc === 'water' ? '#48dbfb' : '#2d132c'; ctx.fillRect(0, 0, c.width, c.height);
  const gY = c.height - 120;
  if (vis(0, 650)) { ctx.fillStyle = loc === 'water' ? '#2ecc71' : '#574b90'; ctx.fillRect(-camX, gY, 650, 120); ctx.fillStyle = '#c8d6e5'; ctx.fillRect(180 - camX, gY, 450, 12); }
  if (vis(120, 40)) { ctx.fillStyle = '#2c2c54'; ctx.fillRect(120 - camX, gY - 35, 40, 35); ctx.fillStyle = '#a29bfe'; ctx.fillRect(136 - camX, gY - 22, 8, 8); }
  if (vis(650, 1850)) { ctx.fillStyle = loc === 'water' ? '#0984e3' : '#e84118'; ctx.fillRect(650 - camX, gY + 15, 1850, 105); }
  for (let id in others) { const o = others[id]; if (o.location === loc && vis(o.x, 30)) drawChar(o.x - camX, gY - 40, o.nick, o.isOwner, o.level); }
  drawChar(px - camX, gY - 40, prof.nick, prof.isOwner, prof.level);
  if (state === 'mini' && vis(bobX, 10)) { ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(px + 25 - camX, gY - 30); ctx.lineTo(bobX - camX, gY + 15); ctx.stroke(); ctx.fillStyle = '#ff4757'; ctx.fillRect(bobX - 5 - camX, gY + 10, 10, 10); }
  if (state === 'cast') { ctx.fillStyle = '#222'; ctx.fillRect(px - camX - 30, gY - 90, 100, 16); ctx.fillStyle = '#2ecc71'; ctx.fillRect(px - camX - 30, gY - 90, power, 16); }
  if (state === 'mini') {
    const mx = c.width / 2 - 120, my = 70;
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(mx, my, 240, 210);
    ctx.fillStyle = 'gold'; ctx.font = 'bold 13px monospace'; ctx.fillText(`Шанс: ${curFish.chance}`, mx + 15, my + 22);
    ctx.fillStyle = '#333'; ctx.fillRect(mx + 25, my + 50, 25, 140);
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(mx + 25, my + 50 + barY * 1.4, 25, (20 + prof.rod.bobber * 2) * 1.4);
    ctx.fillStyle = '#ff9f43'; ctx.fillRect(mx + 29, my + 50 + fishY * 1.4, 17, 12);
    ctx.fillStyle = '#00a8ff'; ctx.fillRect(mx + 75, my + 75, 130 * (prog / 100), 15);
    ctx.fillStyle = tens > 75 ? '#ff4757' : '#ffa502'; ctx.fillRect(mx + 75, my + 125, 130 * (tens / 100), 15);
  }
  requestAnimationFrame(loop);
}

function drawChar(x, y, nick, own, lvl) {
  ctx.fillStyle = '#ffcccc'; ctx.fillRect(x + 6, y, 16, 14); ctx.fillStyle = '#3498db'; ctx.fillRect(x + 4, y + 14, 20, 16); ctx.fillStyle = '#34495e'; ctx.fillRect(x + 6, y + 30, 16, 10);
  ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = own ? 'gold' : '#fff';
  ctx.fillText(own ? `[OWNER] ${nick} (${lvl})` : `${nick} (${lvl})`, x + 14, y - 8); ctx.textAlign = 'left';
}
function openWin(id) { const el = document.getElementById(id); el.classList.toggle('hidden'); if (id === 'inv-win' && !el.classList.contains('hidden')) renderInv(); }
function upg(k) { if (prof.xp < 50) return alert("Нужно 50 XP!"); prof.xp -= 50; prof.rod[k]++; save(); renderInv(); }
function renderInv() {
  const r = prof.rod; document.getElementById('rod-txt').innerText = `Основание:${r.base} | Леска:${r.line} (до ${r.line*15}кг) | Моток:${r.reel} | Приманка:${r.lure} | Поплавок:${r.bobber}`;
  const l = document.getElementById('inv-list'); l.innerHTML = '';
  prof.inventory.forEach((f, i) => l.innerHTML += `<div class="card"><span>[${f.mut}] ${f.name} (${f.weight}кг) ${f.chance}</span><button class="s-btn" onclick="toEnd(${i})">В сундук</button></div>`);
}
function toEnd(i) { prof.enderChest.push(prof.inventory.splice(i, 1)); save(); renderInv(); }
function renderEnd() {
  const l = document.getElementById('end-list'); l.innerHTML = '';
  prof.enderChest.forEach((f, i) => l.innerHTML += `<div class="card"><span>[${f.mut}] ${f.name} (${f.weight}кг)</span><button class="s-btn" onclick="fromEnd(${i})">Забрать</button></div>`);
}
function fromEnd(i) { prof.inventory.push(prof.enderChest.splice(i, 1)); save(); renderEnd(); }
</script>
</body>
</html>
